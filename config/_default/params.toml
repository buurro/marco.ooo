# -- Theme Options --
# Every article option can be overridden per page (or per section via
# `cascade`) in front matter, e.g. `showAuthor: false`.

[article]
  showDate = true
  showAuthor = true
  showReadingTime = true
  showDraftLabel = true
  showBreadcrumbs = true
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
