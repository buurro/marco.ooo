# -- Site Configuration --
# Layouts live in ./layouts, styles in ./assets/css plus the retro-ui
# tokens/components mounted at ./assets/retro-ui (see flake.nix).

baseURL = "https://marco.ooo/"
defaultContentLanguage = "en"
locale = "en"

enableRobotsTXT = true
summaryLength = 0

# No tags/categories pages: nothing links to them.
disableKinds = ["taxonomy", "term"]

[outputs]
  home = ["HTML", "RSS"]

[pagination]
  pagerSize = 10
