name: Create and publish image to ghcr

on:
  push:
    branches: ['main']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@v12
      - name: Read version from flake
        id: version
        run: echo "version=`nix eval --raw .#html.version`" >> "$GITHUB_OUTPUT"
      - name: Log in to the Container registry
        uses: docker/login-action@v3.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build container image
        run: nix build -L .#containerImage
      - name: Load image
        run: |
          ./result | docker load
      - name: Push image to ghcr
        run: |
          export IMAGE_TAG="`nix eval --raw .#containerImage.imageTag`"

          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG"

          docker image tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

  tag-version:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag commit if version is new
        env:
          version: ${{ needs.build-and-push-image.outputs.version }}
        run: |
          if [ -z "$version" ]; then
            echo "::error::Could not read version from the flake"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "Tag $version already exists, nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$version"
          git push origin "$version"

          echo "Tagged $GITHUB_SHA as $version" >> "$GITHUB_STEP_SUMMARY"
